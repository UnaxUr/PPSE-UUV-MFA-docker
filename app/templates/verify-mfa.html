<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificar MFA</title>
</head>
<body>

    <h1>Verificación MFA</h1>

    <p>Introduce el código de 6 dígitos de tu aplicación Authenticator.</p>

    <form method="POST">

        <label>Código MFA:</label><br>
        <input type="text" name="code" maxlength="6" required><br><br>

        <button type="submit">Verificar</button>

    </form>

</body>
</html>
